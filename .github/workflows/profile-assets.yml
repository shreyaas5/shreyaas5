name: Regenerate profile assets

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile_assets.js"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate SVG assets
        run: node scripts/generate_profile_assets.js

      - name: Commit regenerated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate profile assets"
          file_pattern: assets/*.svg
